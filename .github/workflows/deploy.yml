name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Cache-bust local CSS/JS/image references
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Cache-busting local assets with version: $VERSION"
          find dist \( -path '*/node_modules' -o -path '*/stripe-setup' -o -path '*/social-engine' -o -path '*/screenshots' -o -path '*/uploads' \) -prune -o \( -name "*.html" -o -name "*.jsx" \) -type f -print0 | while IFS= read -r -d '' f; do
            perl -pi -e "s{((?:href|src)=\"|src:\s*\")((?!https?:)(?!//)(?!data:)[^\"]+\.(?:css|jsx?|png|jpe?g|gif|svg|webp|ico))(\")}{\${1}\${2}?v=$VERSION\${3}}g" "$f"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
