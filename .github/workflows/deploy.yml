name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Cache-bust local CSS/JS references
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Cache-busting local assets with version: $VERSION"
          find dist -name "*.html" -print0 | while IFS= read -r -d '' f; do
            perl -pi -e "s/((?:href|src)=\")((?:[^\"]*\/)?(?:site\.css|home\.css|theme\.js|app\.jsx|design-system\.css|armory-data\.js|armory-state\.js|armory\.js))(\")/\${1}\${2}?v=$VERSION\${3}/g" "$f"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
