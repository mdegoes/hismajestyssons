<script>
  const nav = document.querySelector('.nav');
  const onScroll = () => nav.setAttribute('data-scrolled', window.scrollY > 8);
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  const navDrops = Array.from(nav.querySelectorAll('.nav-drop'));
  const setDropOpen = (drop, open) => {
    drop.setAttribute('data-open', String(open));
    drop.querySelector('.nav-drop-trigger').setAttribute('aria-expanded', String(open));
  };
  const closeOtherDrops = (except) => {
    navDrops.forEach((drop) => { if (drop !== except) setDropOpen(drop, false); });
  };
  navDrops.forEach((drop) => {
    const trigger = drop.querySelector('.nav-drop-trigger');
    trigger.addEventListener('click', () => {
      const open = drop.getAttribute('data-open') !== 'true';
      closeOtherDrops(drop);
      setDropOpen(drop, open);
    });
    drop.addEventListener('mouseenter', () => {
      closeOtherDrops(drop);
      setDropOpen(drop, true);
    });
    drop.addEventListener('mouseleave', () => setDropOpen(drop, false));
  });

  const navToggle = nav.querySelector('.nav-toggle');
  const setMenuOpen = (open) => {
    nav.setAttribute('data-menu-open', String(open));
    navToggle.setAttribute('aria-expanded', String(open));
    navToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (!open) closeOtherDrops(null);
  };
  const closeMenu = () => setMenuOpen(false);
  navToggle.addEventListener('click', () => {
    setMenuOpen(nav.getAttribute('data-menu-open') !== 'true');
  });
  nav.querySelectorAll('.nav-links a').forEach((a) => a.addEventListener('click', closeMenu));
</script>
